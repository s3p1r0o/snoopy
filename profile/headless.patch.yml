# Snoopy routing for the dsh headless profile (one-shot tasks), layered by
# the launcher with `--patch` on every boot; same routing as web.patch.yml.
- id: llm-pi-ai
  config:
    providers:
      proxy:
        apiKeyEnv: SNOOPY_PROXY_KEY
        api: openai-completions
        baseURL: !!js "`http://127.0.0.1:${process.env.SNOOPY_PORT ?? '8081'}/v1`"
        models:
          - id: rill-assistant
            name: rill-assistant (Rill via the embedded proxy)
            contextWindow: 272000
            maxTokens: 32768
            input: [text]

- id: agent-default-model
  config:
    provider: proxy
    model: rill-assistant

# dsh's plugin manager (agent tool and Web Plugins page) installs bundles with
# pnpm: use the one bundled with snoopy (SNOOPY_PNPM), else pnpm from PATH.
- id: plugin-manager
  config:
    pnpmCommand: !!js process.env.SNOOPY_PNPM ?? 'pnpm'
